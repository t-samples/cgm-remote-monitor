name: CI test and publish Docker image

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  image-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify state and keys stay out of the Docker build context
        run: |
          packet=$(mktemp -d)
          output=$(mktemp -d)
          cp .dockerignore "$packet/"
          mkdir -p "$packet"/{mongo-data,letsencrypt,lib}
          touch "$packet/mongo-data/medical-canary" "$packet/letsencrypt/acme.json" "$packet/lib/test.p8" "$packet/lib/test.sqlite"
          echo '{}' > "$packet/package.json"
          printf 'FROM scratch\nCOPY . /context/\n' > "$packet/Dockerfile"
          docker buildx build --output "type=local,dest=$output" "$packet"
          test -f "$output/context/package.json"
          test ! -e "$output/context/mongo-data/medical-canary"
          test ! -e "$output/context/letsencrypt/acme.json"
          test ! -e "$output/context/lib/test.p8"
          test ! -e "$output/context/lib/test.sqlite"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
        mongodb-version: [4.4, 5.0, 6.0]

    steps:
      - name: Git Checkout
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm run-script test-ci
      - name: Send Coverage
        run: npm run-script coverage

  publish:
    name: Publish to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') && github.repository_owner == 'nightscout'
    env:
      DOCKER_IMAGE: nightscout/cgm-remote-monitor
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Clean git Checkout
        if: success()
        uses: actions/checkout@v3
      - name: Build, tag and push the dev Docker image
        if: success() && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          no-cache: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:dev_${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest_dev

      - name: Get Nightscout release version
        if: success() && github.ref == 'refs/heads/master'
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
      - name: Build, tag and push the master Docker image
        if: success() && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          no-cache: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.package-version.outputs.current-version }}
            ${{ env.DOCKER_IMAGE }}:latest